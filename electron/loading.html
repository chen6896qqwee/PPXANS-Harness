<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>皮皮虾</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(1200px 600px at 50% 20%, #16181d 0%, #0b0b0a 70%);
    color: #e8e6e1;
    font-family: "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
    user-select: none;
    -webkit-app-region: drag;
  }
  .box { text-align: center; padding: 0 32px; }
  .logo { width: 72px; height: 72px; margin: 0 auto 20px; }
  .logo .ring { transform-origin: 50% 50%; animation: spin 2.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: .04em; margin: 0 0 10px; }
  #status { font-size: 13px; color: #8b8f98; min-height: 20px; }
  .dots::after { content: ""; animation: dots 1.4s steps(4, end) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .hint { margin-top: 18px; font-size: 12px; color: #5b5f68; }
  body.failed .logo { display: none; }
  body.failed #status { color: #e5534b; }
  .bar {
    margin: 26px auto 0; width: 180px; height: 3px; border-radius: 2px;
    background: #22252b; overflow: hidden;
  }
  .bar i {
    display: block; width: 40%; height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, transparent, #4d6bfe, transparent);
    animation: slide 1.3s ease-in-out infinite;
  }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }
  body.failed .bar { display: none; }
</style>
</head>
<body>
  <div class="box">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="7" fill="#4d6bfe"/>
      <g class="ring">
        <path d="M16 6 6.8 16 16 26.2 25.2 16z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" opacity=".9"/>
      </g>
      <circle cx="16" cy="16" r="3" fill="#fff"/>
    </svg>
    <h1 id="title">皮皮虾</h1>
    <div id="status">正在启动<span class="dots"></span></div>
    <div class="bar"><i></i></div>
    <div class="hint">首次启动需要初始化内核, 请稍候</div>
  </div>
</body>
</html>
