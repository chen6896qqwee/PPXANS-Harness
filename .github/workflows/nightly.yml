# .github/workflows/nightly.yml — 每晚自动基准 (2026-11-17)
# docs/bench/nightly-*.md 此前声称 "CI 每晚自动运行: .github/workflows/nightly.yml"
# 但仓库里一直没有这个文件 —— 本文件补齐声称, 让文档从虚假变为可执行。
# 跑四基准 (eval/bench/selfheal/audit) + 全量测试, 结果留在 Actions artifacts。
# 不发布 nightly MD 到仓库 (写盘需要 write 权限, Actions 默认只读);
# 要更新 docs/bench/nightly-<date>.{json,md} 仍需本地跑 npm run nightly 后手动提交。
name: nightly

on:
  schedule:
    - cron: "0 18 * * *"   # UTC 18:00 = UTC+8 02:00, 避开高峰
  workflow_dispatch: {}     # 手动触发 (调试用)

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 本地能力评测 (eval)
        run: node scripts/eval.js

      - name: 内核吞吐压测 (bench)
        run: node scripts/bench.js

      - name: 自愈基准 (selfheal)
        run: node scripts/selfheal-bench.js

      - name: 审计链校验 (audit:verify)
        run: npm run audit:verify

      - name: 离线任务基准 (taskbench:offline --strict)
        run: node scripts/taskbench-offline.js --strict

      - name: 记忆召回质量 (memory:recall)
        run: node scripts/memory-recall.js --check

      - name: 全量测试
        run: npm test

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-results
          path: |
            docs/bench/
            data/bench/
          retention-days: 30
          if-no-files-found: ignore
