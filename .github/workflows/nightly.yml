# Nightly 基准报告 (2026-10-24): 把"对外讲不出数"变成"每晚一条可复现曲线"。
# 跑 nightly-bench (eval + bench + selfheal + audit 四合一, 零 LLM 零网络),
# 产出 docs/bench/nightly-<date>.{json,md} 并提交回仓库 (历史即趋势)。
name: nightly-bench

on:
  schedule:
    - cron: "30 18 * * *" # UTC 18:30 = 北京时间次日 02:30 (低峰)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # README 里的测试总数/通过数只有跑完整个套件才拿得到, 白天 CI 不重复跑;
      # 放到 nightly 兜底, 避免锚点长期漂移 (2026-10-30)。
      - name: README test counts sync
        run: node scripts/readme-sync-check.js --with-tests
        timeout-minutes: 15
      - name: 运行 nightly 基准
        run: node scripts/nightly-bench.js
      - name: 提交报告 (有变化才提交)
        run: |
          git config user.name "ppx-nightly-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/bench/
          if git diff --cached --quiet; then
            echo "报告无变化, 跳过提交"
          else
            git commit -m "chore(bench): nightly report $(date +%F)"
            git push
          fi
