name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 主工程: 纯 Node 零依赖, 但项目本身是 Windows-first —— 文件锁/换行符/路径分隔符/子进程回收
  # 这些只在 Windows 上暴露, 所以必须 ubuntu + windows 双 OS 跑 (2026-10-04 补 windows 矩阵)。
  test:
    name: test (node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
        include:
          # package.json engines 承诺 >=20, 最低支持版本只在 Linux 上验一次 (省一台 Windows runner 的排队时间)
          - os: ubuntu-latest
            node-version: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run full test suite
        run: npm test
        timeout-minutes: 15
      # README 实测数字闸门 (2026-10-07 评估报告 P0-1): README 曾写着 1440 测试 / 4285 tok /
      # 64 工具 / 23 核心 schema, 实测是 1543 / 5355 / 85 / 26 —— 数字手写必然漂移, 而它是
      # 外人看项目的第一张脸。这里逐项真机实测比对 README 里的机读锚点, 不符即红。
      # 不校验 tests 项 (要跑 70s 全量测试才拿得到, 不值当每次 push 都付; 它走 --with-tests,
      # 挂在 prepublishOnly 和下面的 nightly 思路里)。
      - name: README numbers sync check
        run: node scripts/readme-sync-check.js
        timeout-minutes: 5

      # 架构守卫 (2026-10-07 评估报告 P1-6): 33→37 个模块目录, 分层是否单向此前只靠 review ——
      #   首次运行即抓出 3 个依赖环 (core→tools→core 等), 已通过常量下沉与模块归位清零。
      #   存量越层冻结在脚本内的 ARCH_BASELINE (写了清理理由), 闸门只拦**新增** ——
      #   "第一次跑就全红"的闸门等于没有闸门 (会立刻被 || true 废掉), 要的是棘轮不是断头台。
      - name: Architecture guard
        run: node scripts/arch-guard.js --check
        timeout-minutes: 3
      # 协作层长任务压测 (2026-10-07 评估报告 P1-1): 班组/房间的全部证据原本只是单元测试,
      #   评估报告给这维打 84 分时明说了那是"设计分不是实测分"。这里用桩执行器跑
      #   5 拓扑 × N 任务, 看吞吐/饿死率/在途账本残留/时间线膨胀四项。离线零密钥。
      - name: Team longrun bench
        run: node bench/team-longrun.js --tasks 40
        timeout-minutes: 5

      # Skill 元数据闸门: 断链/缺段落/幻觉工具名会让 load_skill 在运行期才炸
      - name: Skill lint
        run: node scripts/skill-lint.js
        timeout-minutes: 3
      # 上下文预算闸门: 固定开销每请求都付费, 一段工具描述就能悄悄涨几百 tok (超 5800 直接红)
      # 预算沿革与每次涨价的逐项明细写在 scripts/ctx-profile.js 顶部 (2026-10-07 由 4500 提到 5800:
      # 多 Agent 协作进核心 schema + 能力边界护栏 + 全量技能名册; 同时瘦掉 spawn_agent 与技能描述)
      - name: Context budget check
        run: node scripts/ctx-profile.js --check
        timeout-minutes: 5
      # 前缀缓存完整性闸门: prompts.js 把 system prompt 重排成「静态块在前 / 检索段在后」, 收益
      # 全靠 provider 的**最长公共前缀**匹配 —— 静态区里混进时间戳/日期/随机值/临时路径/记忆文本,
      # 缓存对之后每个请求悄悄失效, 而预算闸门 (ctx-profile) 完全看不出来 (字节数没变, 变的是字节内容)。
      # 这一步用捕获桩真跑一次多轮会话 (含工具往返), 断言四条不变量 a/b/c/d, 全程离线零密钥零网络。
      - name: Prompt cache integrity audit
        run: node scripts/cache-audit.js --check
        timeout-minutes: 5
      - name: Self-heal benchmark
        run: node scripts/selfheal-bench.js
        timeout-minutes: 5
      - name: Audit chain verify
        run: node scripts/audit-verify.js
        timeout-minutes: 5
      # 判分器可证伪门禁 (bench/falsify.js): 逐个基准任务验证「参考解判正 + 全部变异体判负」,
      # 任一条不成立即非零退出 —— 不给 || true, 也不给豁免开关 (taskbench.js 刚修过恒 0 反模式)。
      # 与下面 eval job 的「Taskbench smoke」是两件事, 不重复: 那一步跑的是真 agent + 真 LLM,
      # 必须配 PPX_E2E_* secret 才跑得动, 而且一次只能赔上 1 个任务的额度; 这一步只看
      # 「尺子本身准不准」, 全程离线 (mkdtemp 沙箱 + node 子进程, 零网络零密钥), 所以
      # (1) 任何 fork 上没配 secret 的 PR 也必须能跑 —— 判分器偏袒类 bug 正是靠真跑才发现的,
      #     等有钱才能验证等于没有验证;
      # (2) 放在 ubuntu+windows 双 OS 矩阵里 (Windows 路径/ESM 那条 ERR_UNSUPPORTED_ESM_URL_SCHEME
      #     只在 win32 暴露), 而 eval job 只有 ubuntu。
      - name: Bench verifier falsifiability gate
        run: node bench/falsify.js
        timeout-minutes: 3

  # 前端是 public/ 下的无构建静态三件套 (index.html + app.js + app.css), 没有 web/ 这个 npm 子包
  # —— 旧 job 一直在 checkout 一个不存在的目录跑 tsc/build, 等于永远红。
  # 真正的检查是零依赖静态自检 (DOM id/图标/资源引用/JS 语法)。见 scripts/check-web.mjs
  web:
    name: web static check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static self-check (public/)
        run: npm run web:check
        timeout-minutes: 5

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Local capability eval
        run: node scripts/eval.js
        timeout-minutes: 5
      - name: LLM E2E regression
        env:
          PPX_E2E_BASE_URL: ${{ secrets.PPX_E2E_BASE_URL }}
          PPX_E2E_API_KEY: ${{ secrets.PPX_E2E_API_KEY }}
          PPX_E2E_MODEL: ${{ secrets.PPX_E2E_MODEL }}
        run: |
          if [ -n "$PPX_E2E_BASE_URL" ]; then
            node scripts/eval.js --llm
          else
            echo "PPX_E2E_BASE_URL not set; skipping LLM E2E regression"
          fi
        timeout-minutes: 10
      # 任务级基准 (真 LLM, 花钱): 只在配了密钥的仓库上跑 1 个任务的冒烟, 全量 --full 留给本地发版前
      # taskbench 未全过退 1; bash -e 下 if-then 体内失败会中止脚本, 别加 || true 否则闸门失效
      - name: Taskbench smoke (1 task)
        env:
          PPX_E2E_BASE_URL: ${{ secrets.PPX_E2E_BASE_URL }}
          PPX_E2E_API_KEY: ${{ secrets.PPX_E2E_API_KEY }}
          PPX_E2E_MODEL: ${{ secrets.PPX_E2E_MODEL }}
        run: |
          if [ -n "$PPX_E2E_BASE_URL" ]; then
            node scripts/taskbench.js --limit 1
          else
            echo "PPX_E2E_BASE_URL not set; skipping taskbench smoke"
          fi
        timeout-minutes: 10
