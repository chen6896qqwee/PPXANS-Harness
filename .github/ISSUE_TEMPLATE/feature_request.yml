name: Feature request
description: 提出新能力或改进建议
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前哪里不方便？影响什么场景？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 方案不引入运行时 npm 依赖（项目红线）
          required: true
