<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>皮皮虾 · PPX Agent</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<!-- ===== 图标集 (内联 sprite, 零外部请求) ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<g id="i-mark"><path d="M12 3.2 4.6 12 12 20.8 19.4 12z"/><circle cx="12" cy="12" r="2.3"/></g>
<g id="i-plus"><path d="M12 5v14M5 12h14"/></g>
<g id="i-search"><circle cx="11" cy="11" r="6.2"/><path d="m20 20-3.6-3.6"/></g>
<g id="i-refresh"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></g>
<g id="i-collapse"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M10 4v16"/></g>
<g id="i-panel"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M15 4v16"/></g>
<g id="i-settings"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1v.2a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-2.8-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3.6 15H3.4a2 2 0 1 1 0-4h.2A1.6 1.6 0 0 0 4.7 8.3l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h.1a1.6 1.6 0 0 0 1-1.5v-.2a2 2 0 1 1 4 0v.2a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v.1a1.6 1.6 0 0 0 1.5 1h.2a2 2 0 1 1 0 4h-.2a1.6 1.6 0 0 0-1.5 1z"/></g>
<g id="i-send"><path d="M12 19V5"/><path d="m5.5 11.5 6.5-6.5 6.5 6.5"/></g>
<g id="i-stop"><rect x="7" y="7" width="10" height="10" rx="1.6" fill="currentColor" stroke="none"/></g>
<g id="i-mic"><rect x="9" y="3" width="6" height="10" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3"/></g>
<g id="i-folder"><path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h3.4l2 2.2h7.6a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></g>
<g id="i-file"><path d="M6 3.5h7l5 5v12H6z"/><path d="M13 3.5v5h5"/></g>
<g id="i-chev-d"><path d="m6 9 6 6 6-6"/></g>
<g id="i-chev-r"><path d="m9 6 6 6-6 6"/></g>
<g id="i-close"><path d="M6 6l12 12M18 6L6 18"/></g>
<g id="i-edit"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14.5 6.5 17.5 9.5"/></g>
<g id="i-trash"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/></g>
<g id="i-check"><path d="m5 13 4.5 4.5L19 7"/></g>
<g id="i-sliders"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></g>
<g id="i-cube"><path d="M12 3.2 20 7.6v8.8L12 20.8 4 16.4V7.6z"/><path d="M4 7.6 12 12l8-4.4M12 12v8.8"/></g>
<g id="i-plug"><path d="M9 3v5M15 3v5"/><path d="M6.5 8h11v3.5a5.5 5.5 0 0 1-11 0z"/><path d="M12 17v4"/></g>
<g id="i-bot"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4"/><circle cx="9.2" cy="13" r="1.2" fill="currentColor" stroke="none"/><circle cx="14.8" cy="13" r="1.2" fill="currentColor" stroke="none"/></g>
<g id="i-info"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><circle cx="12" cy="8" r="1" fill="currentColor" stroke="none"/></g>
<g id="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></g>
<g id="i-moon"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></g>
<g id="i-monitor"><rect x="3" y="4.5" width="18" height="12.5" rx="2"/><path d="M9 21h6M12 17v4"/></g>
<g id="i-brain"><path d="M12 5.5a3 3 0 0 0-3 3v.4A2.8 2.8 0 0 0 7 11.5c0 .9.4 1.6 1 2.1v.4a3 3 0 0 0 4 2.8V5.5z"/><path d="M12 5.5a3 3 0 0 1 3 3v.4a2.8 2.8 0 0 1 2 2.6c0 .9-.4 1.6-1 2.1v.4a3 3 0 0 1-4 2.8"/></g>
<g id="i-activity"><path d="M3 12h4l2.5-6 4 12L16 12h5"/></g>
<g id="i-bars"><path d="M5 20V11M12 20V5M19 20v-6"/></g>
<g id="i-list"><path d="M8 6.5h12M8 12h12M8 17.5h12"/><circle cx="4.4" cy="6.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="4.4" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="4.4" cy="17.5" r="1.1" fill="currentColor" stroke="none"/></g>
<g id="i-folder-open"><path d="M3.5 8.5h17l-2 10h-13z"/><path d="M3.5 8.5V6a1.5 1.5 0 0 1 1.5-1.5h3.6l1.8 2h5.1A1.5 1.5 0 0 1 17 8"/></g>
<g id="i-stop-dot"><circle cx="12" cy="12" r="8.5"/><rect x="9.4" y="9.4" width="5.2" height="5.2" rx="1" fill="currentColor" stroke="none"/></g>
</defs></svg>

<div class="app">
  <!-- ================= 侧栏 ================= -->
  <aside class="side" id="side">
    <div class="brand">
      <span class="mark"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><use href="#i-mark"/></svg></span>
      <span class="bname">皮皮虾</span>
      <span class="btag" id="brandTag">PPX</span>
      <button class="icobtn" id="btnCollapse" title="收起侧栏" aria-label="收起侧栏" aria-controls="side" aria-expanded="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><use href="#i-collapse"/></svg></button>
    </div>

    <button class="newchat" id="btnNew">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><use href="#i-plus"/></svg>
      新会话
    </button>

    <div class="side-scroll">
      <div class="group">
        <div class="ghead">
          <span class="lab">会话</span>
          <span class="gacts">
            <button class="icobtn sm" id="btnSessSearch" title="搜索会话"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><use href="#i-search"/></svg></button>
            <button class="icobtn sm" id="btnSessRefresh" title="刷新"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-refresh"/></svg></button>
          </span>
        </div>
        <div class="gbody" id="sessList"></div>
      </div>

      <div class="group">
        <div class="ghead">
          <span class="lab">工作区</span>
          <span class="gacts">
            <button class="icobtn sm" id="btnWsRoot" title="切换工作区目录"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-folder-open"/></svg></button>
            <button class="icobtn sm" id="btnWsRefresh" title="刷新"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-refresh"/></svg></button>
          </span>
        </div>
        <div class="gbody" id="wsList"></div>
      </div>
    </div>

    <div class="side-foot">
      <button class="nav" id="btnSettings">
        <span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-settings"/></svg></span>
        <span class="lab">设置</span>
      </button>
      <div class="conn" id="conn"><i class="dot"></i><span class="txt">连接中…</span></div>
    </div>
  </aside>

  <!-- ================= 主区 ================= -->
  <main class="main">
    <header class="topbar">
      <button class="icobtn" id="btnSide" title="展开侧栏" aria-label="展开侧栏" aria-controls="side" aria-expanded="false" hidden><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><use href="#i-collapse"/></svg></button>
      <div class="tb-title" id="tbTitle">新会话</div>
      <div class="tb-right">
        <button class="icobtn" id="btnDrawer" title="面板" aria-label="打开右侧面板" aria-controls="drawer" aria-expanded="false"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><use href="#i-panel"/></svg></button>
        <button class="icobtn" id="btnSettings2" title="设置" aria-label="打开设置"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-settings"/></svg></button>
      </div>
    </header>

    <div class="stage">
      <section class="hero" id="hero">
        <span class="mark"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><use href="#i-mark"/></svg></span>
        <h1>探索未至之境<span class="badge" id="heroVer">…</span></h1>
        <div class="sub" id="heroSub">零依赖智能体内核 · 记忆 / 工具 / 军团 / 自愈</div>
        <div class="quick" id="quick"></div>
      </section>
      <div class="stream" id="stream" hidden><div class="col" id="col" role="log" aria-live="polite" aria-relevant="additions text" aria-label="对话内容"></div></div>
    </div>

    <footer class="foot-wrap">
      <div class="composer" id="composer">
        <div class="chips">
          <button class="chip" id="chipWs"><span class="cv"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><use href="#i-folder"/></svg></span><span id="wsLabel">工作区</span></button>
          <button class="chip" id="chipPerm"><span id="permLabel">标准模式</span><span class="cv"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><use href="#i-chev-d"/></svg></span></button>
        </div>
        <div class="inrow">
          <textarea id="inp" rows="1" aria-label="消息输入框" placeholder="描述你想要构建的内容 / 提问 / 输入指令…（@ 引用工作区文件）"></textarea>
        </div>
        <div class="cfoot">
          <button class="icobtn ring" id="btnPlus" title="更多"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><use href="#i-plus"/></svg></button>
          <button class="chip mini" id="chipTools"><span class="cv"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-plug"/></svg></span><span id="toolsLabel">工具</span></button>
          <div class="grow"></div>
          <button class="chip mini" id="chipModel"><span id="modelLabel">模型</span><span class="cv"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><use href="#i-chev-d"/></svg></span></button>
          <button class="send" id="btnSend" disabled title="发送 (Enter)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-send"/></svg></button>
        </div>
      </div>
      <div class="foot-note" id="footNote">Enter 发送 · Shift+Enter 换行 · Esc 停止生成</div>
    </footer>

    <!-- 右侧面板抽屉 -->
    <aside class="drawer" id="drawer">
      <div class="dhead">
        <div class="dtabs">
          <button class="dtab active" data-p="memory">记忆</button>
          <button class="dtab" data-p="traces">轨迹</button>
          <button class="dtab" data-p="stats">统计</button>
          <button class="dtab" data-p="tasks">定时任务</button>
          <button class="dtab" data-p="env">环境</button>
        </div>
        <button class="icobtn" id="btnDrawerClose" title="关闭"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><use href="#i-close"/></svg></button>
      </div>
      <div class="dbody" id="drawerBody"></div>
    </aside>
  </main>
</div>

<!-- ================= 设置 ================= -->
<div class="mask" id="setMask">
  <div class="modal" role="dialog" aria-modal="true" aria-label="设置" tabindex="-1">
    <nav class="mset">
      <div class="mtitle">设置</div>
      <button class="mrow active" data-s="general"><span class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><use href="#i-sliders"/></svg></span>通用设置</button>
      <button class="mrow" data-s="model"><span class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><use href="#i-cube"/></svg></span>模型</button>
      <button class="mrow" data-s="plugin"><span class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><use href="#i-plug"/></svg></span>插件</button>
      <button class="mrow" data-s="agent"><span class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><use href="#i-bot"/></svg></span>Agent 预设</button>
      <button class="mrow" data-s="about"><span class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><use href="#i-info"/></svg></span>关于 / 体检</button>
    </nav>
    <section class="mbody">
      <div class="mhead">
        <span class="t" id="setTitle">通用设置</span>
        <div class="grow"></div>
        <button class="ghost" id="btnOpenCfg">打开配置文件</button>
        <button class="icobtn" id="btnSetClose" title="关闭"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><use href="#i-close"/></svg></button>
      </div>
      <div class="mcontent" id="setBody"></div>
    </section>
  </div>
</div>

<!-- ================= 通用表单弹窗 ================= -->
<div class="mask" id="formMask">
  <div class="modal narrow" role="dialog" aria-modal="true" aria-labelledby="formTitle" tabindex="-1">
    <div class="mhead">
      <span class="t" id="formTitle">编辑</span>
      <div class="grow"></div>
      <button class="icobtn" id="btnFormClose" title="关闭"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><use href="#i-close"/></svg></button>
    </div>
    <div class="mcontent" id="formBody"></div>
    <div class="mhead" style="border-top:1px solid var(--line);border-bottom:none;justify-content:flex-end">
      <button class="ghost" id="btnFormCancel">取消</button>
      <button class="ghost primary" id="btnFormOk">确定</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="/vendor/marked.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
