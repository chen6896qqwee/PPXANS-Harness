<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace" role="img" aria-label="PPXANS-Harness demo">
  <defs>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3138"/>
      <stop offset="1" stop-color="#21262d"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="760" height="470" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="760" height="470" rx="12" fill="#0d1117"/>
    <rect x="0" y="0" width="760" height="34" fill="url(#titlebar)"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="17" r="6" fill="#27c93f"/>
    <text x="380" y="22" fill="#8b949e" font-size="12" text-anchor="middle">ppxans-harness — zsh</text>

    <g font-size="14">
      <!-- line 1 -->
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.15s" fill="freeze"/>
        <text x="20" y="66" fill="#27c93f">$</text>
        <text x="40" y="66" fill="#e6edf3">git clone github.com/chen6896qqwee/PPXANS-Harness &amp;&amp; cd PPXANS-Harness</text>
      </g>
      <!-- line 2 -->
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.15s" fill="freeze"/>
        <text x="20" y="94" fill="#27c93f">$</text>
        <text x="40" y="94" fill="#e6edf3">npm start  <tspan fill="#8b949e"># 没有 npm install，零依赖</tspan></text>
      </g>
      <!-- output block -->
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.2s" fill="freeze"/>
        <text x="40" y="128" fill="#f0883e" font-weight="bold">🦐 PPXANS-Harness v3.2.0</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.2s" fill="freeze"/>
        <text x="40" y="152" fill="#3fb950">✓</text><text x="64" y="152" fill="#c9d1d9">self-heal <tspan fill="#3fb950">7/7 (100%)</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.2s" fill="freeze"/>
        <text x="40" y="176" fill="#3fb950">✓</text><text x="64" y="176" fill="#c9d1d9">63 tools registered <tspan fill="#8b949e">(20 core → LLM, 43 on demand)</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.2s" fill="freeze"/>
        <text x="40" y="200" fill="#3fb950">✓</text><text x="64" y="200" fill="#c9d1d9">memory L0–L4 + SHA-256 audit chain ready</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.2s" fill="freeze"/>
        <text x="40" y="224" fill="#58a6ff">→</text><text x="64" y="224" fill="#58a6ff">http://127.0.0.1:8899</text>
      </g>
      <!-- self-heal command -->
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="4.0s" dur="0.15s" fill="freeze"/>
        <text x="20" y="262" fill="#27c93f">$</text>
        <text x="40" y="262" fill="#e6edf3">node scripts/selfheal-bench.js</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="4.7s" dur="0.2s" fill="freeze"/>
        <text x="40" y="286" fill="#e6edf3">Self-heal score: <tspan fill="#3fb950" font-weight="bold">7/7 (100.0%)</tspan></text>
      </g>
      <!-- test command -->
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="5.4s" dur="0.15s" fill="freeze"/>
        <text x="20" y="324" fill="#27c93f">$</text>
        <text x="40" y="324" fill="#e6edf3">npm test</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="6.4s" dur="0.2s" fill="freeze"/>
        <text x="40" y="348" fill="#c9d1d9">tests <tspan fill="#e6edf3">1022</tspan>  pass <tspan fill="#3fb950">1018</tspan>  fail <tspan fill="#f85149">0</tspan>  skip 4  <tspan fill="#8b949e">(5.8s)</tspan></text>
      </g>
      <!-- final prompt -->
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="7.4s" dur="0.15s" fill="freeze"/>
        <text x="20" y="392" fill="#27c93f">$</text>
        <rect x="34" y="380" width="9" height="17" fill="#e6edf3">
          <animate attributeName="opacity" values="1;0;1" dur="1.1s" begin="7.4s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- footer tagline -->
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="8.2s" dur="0.6s" fill="freeze"/>
        <text x="20" y="436" fill="#6e7681" font-size="12">pure Node.js · zero runtime dependencies · Apache-2.0</text>
      </g>
    </g>
  </g>
</svg>
